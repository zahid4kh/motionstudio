[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "motionstudio"
version = "0.1.0"
description = "Control MotionStudio robots and stations from Python"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[tool.setuptools]
packages = ["motionstudio"]

[tool.setuptools.package-data]
motionstudio = ["py.typed"]
