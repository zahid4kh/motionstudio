# Builds the Kotlin API reference with Dokka and publishes it on GitHub Pages
# (https://zahid4kh.github.io/motionstudio/). Needs Settings › Pages › Source: GitHub Actions.
name: Kotlin API docs

on:
  push:
    branches: [main]
    paths:
      - "api/kotlin/**"
      - ".github/workflows/kotlin-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew dokkaGenerate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: api/kotlin/build/dokka/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
